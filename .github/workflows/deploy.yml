name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUDFLARE_PAGES_PROJECT: kcd-cairo-2027

# One deploy per target at a time. github.ref is refs/heads/main for production
# (push or manual run) and refs/pull/<number>/merge for each pull request.
# - main: a deploy that has started always finishes; of the runs waiting behind
#   it, GitHub keeps only the newest and cancels the rest.
# - pull requests: each PR has its own lane, so previews never hold up
#   production, and a new push cancels that PR's older preview run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pull requests build the commit that triggered the run. Pushes and manual
      # runs build the newest commit on the branch at the moment the run starts,
      # so a run that waited in the queue, or a re-run of an old run, can never
      # put an older version of the site back.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && github.ref || '' }}

      - name: Note which commit is deployed
        if: github.event_name != 'pull_request'
        run: |
          built="$(git rev-parse HEAD)"
          if [ "$built" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_REF_NAME} moved on after this run was triggered by ${GITHUB_SHA:0:7}. Deploying the newest commit, ${built:0:7}, instead."
          fi
          echo "Deploying \`${built:0:7}\` from \`${GITHUB_REF_NAME}\` (run triggered by \`${GITHUB_SHA:0:7}\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build Gatsby site
        run: yarn build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment on PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 8);
            const prNumber = context.payload.pull_request.number;
            const projectName = process.env.PROJECT_NAME;

            // Cloudflare Pages branch alias: lowercase, non [a-z0-9-] replaced with "-", max 28 chars
            const branchAlias = branchName
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-')
              .replace(/^-+|-+$/g, '')
              .substring(0, 28)
              .replace(/-+$/g, '');
            // Cloudflare cuts the alias to 28 characters and adds a suffix when two
            // branches collide, so prefer the URLs wrangler reports for this deploy.
            const trim = (url) => (url || '').replace(/\/+$/, '');
            const aliasUrl = trim(process.env.ALIAS_URL) || `https://${branchAlias}.${projectName}.pages.dev`;
            const previewUrl = trim(process.env.DEPLOYMENT_URL) || aliasUrl;

            const comment = `## 🚀 Deployment Ready for Review

            Your branch has been deployed to Cloudflare Pages!

            **Preview URL:** ${previewUrl}
            **Branch alias:** ${aliasUrl} (always the latest deploy of this branch)

            ### Pages to Review:
            - **Landing page (coming soon):** ${previewUrl}
            - **404 page:** ${previewUrl}/this-page-does-not-exist

            ### What to Check:
            - ✅ Hero shows "KCD Cairo 2027", the status pill ("Save the date" once the date is set), date and location
            - ✅ Only links that are filled in \`src/content/event-data.json\` are visible
            - ✅ Responsive design on mobile/tablet/desktop
            - ✅ Mobile navigation toggle (when more than one nav item is enabled)

            ---
            *Deployment: ${commitSha} | Branch: ${branchName}*`;

            // Find existing deployment comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Deployment Ready for Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
