name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUDFLARE_PAGES_PROJECT: kcd-cairo-2027

# One deploy per lane at a time:
# - Production (pushes and manual runs on main) shares one lane. A deploy that
#   has started always finishes; of the runs waiting behind it, GitHub keeps
#   only the newest and cancels the rest.
# - Each pull request has its own lane, so previews never hold up production,
#   and a new push cancels that PR's older preview run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A normal run takes about 5 minutes. A stuck run is cancelled so it can't
    # hold up the production lane.
    timeout-minutes: 30
    permissions:
      actions: write # start a fresh run when this one is superseded
      contents: read
      pull-requests: write
    steps:
      # A run for a push or manual run deploys only if its commit is still the
      # newest on the branch when the run starts. Otherwise (it waited in the
      # queue, or it is a re-run of an older run) it deploys nothing and starts
      # a fresh run on the branch, which builds the newest commit with the
      # newest copy of this workflow. Production never goes back to an older
      # version and always catches up to the latest main.
      - name: Check this is still the newest commit
        id: freshness
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "Deploying \`${GITHUB_SHA:0:7}\`, the newest commit on \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "superseded=true" >> "$GITHUB_OUTPUT"
          echo "::notice::${GITHUB_REF_NAME} has moved on from ${GITHUB_SHA:0:7} to ${latest:0:7}. Skipped this deploy and started a fresh run for the newest commit."
          echo "Skipped: \`${GITHUB_REF_NAME}\` has moved on from \`${GITHUB_SHA:0:7}\` to \`${latest:0:7}\`. Started a fresh run to deploy it." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        if: steps.freshness.outputs.superseded != 'true'
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build Gatsby site
        if: steps.freshness.outputs.superseded != 'true'
        run: yarn build

      # Pull requests from forks get no Cloudflare secrets, so they build but
      # skip the preview. This also keeps a fork's "main" branch from ever
      # being deployed as --branch=main, which Cloudflare treats as production.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: >-
          steps.freshness.outputs.superseded != 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment on PR with deployment URL
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 8);
            const prNumber = context.payload.pull_request.number;
            const projectName = process.env.PROJECT_NAME;

            // Cloudflare Pages branch alias: lowercase, non [a-z0-9-] replaced with "-", max 28 chars
            const branchAlias = branchName
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-')
              .replace(/^-+|-+$/g, '')
              .substring(0, 28)
              .replace(/-+$/g, '');
            // Cloudflare cuts the alias to 28 characters and adds a suffix when two
            // branches collide, so prefer the URLs wrangler reports for this deploy.
            const trim = (url) => (url || '').replace(/\/+$/, '');
            const aliasUrl = trim(process.env.ALIAS_URL) || `https://${branchAlias}.${projectName}.pages.dev`;
            const previewUrl = trim(process.env.DEPLOYMENT_URL) || aliasUrl;

            const comment = `## 🚀 Deployment Ready for Review

            Your branch has been deployed to Cloudflare Pages!

            **Preview URL:** ${previewUrl}
            **Branch alias:** ${aliasUrl} (always the latest deploy of this branch)

            ### Pages to Review:
            - **Landing page (coming soon):** ${previewUrl}
            - **404 page:** ${previewUrl}/this-page-does-not-exist

            ### What to Check:
            - ✅ Hero shows "KCD Cairo 2027", the status pill ("Save the date" once the date is set), date and location
            - ✅ Only links that are filled in \`src/content/event-data.json\` are visible
            - ✅ Responsive design on mobile/tablet/desktop
            - ✅ Mobile navigation toggle (when more than one nav item is enabled)

            ---
            *Deployment: ${commitSha} | Branch: ${branchName}*`;

            // Find existing deployment comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Deployment Ready for Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
